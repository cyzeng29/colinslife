<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Cold-press paper, tiled under every page: a fine tooth, and a broader
       mottle where the sheet takes light unevenly. Both tile seamlessly. -->
  <defs>
    <filter id="tooth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="11" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 -1.4 0.86" />
    </filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="4" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.44  0 0 0 0 0.32  0 0 0 -1.6 0.95" />
    </filter>
  </defs>
  <rect width="320" height="320" filter="url(#mottle)" opacity="0.1" />
  <rect width="320" height="320" filter="url(#tooth)" opacity="0.4" />
</svg>
