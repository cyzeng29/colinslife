<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" preserveAspectRatio="none">
  <!-- A loose watercolour wash for behind the sketchbook: soft pools of sage,
       olive and a little ochre, their edges pushed around by noise and left
       slightly darker where the pigment dried, as a wash does on paper. -->
  <defs>
    <filter id="bleed" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="4" seed="7" result="flow" />
      <feDisplacementMap in="SourceGraphic" in2="flow" scale="120" xChannelSelector="R" yChannelSelector="G" result="spread" />
      <feGaussianBlur in="spread" stdDeviation="16" result="soft" />
      <!-- the dried edge: a thin ring where the soft wash meets the paper -->
      <feMorphology in="soft" operator="erode" radius="5" result="inner" />
      <feComposite in="soft" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="2.5" result="rimSoft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="rimSoft" />
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" />
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.37  0 0 0 0 0.28  0 0 0 -0.9 0.62" />
    </filter>
  </defs>
  <g filter="url(#bleed)">
    <ellipse cx="250" cy="260" rx="270" ry="170" fill="#b8c6a2" fill-opacity="0.55" />
    <ellipse cx="430" cy="470" rx="230" ry="150" fill="#9aab7f" fill-opacity="0.38" />
    <ellipse cx="900" cy="230" rx="260" ry="150" fill="#c9d3b4" fill-opacity="0.55" />
    <ellipse cx="1000" cy="520" rx="210" ry="170" fill="#a9b98e" fill-opacity="0.42" />
    <ellipse cx="640" cy="160" rx="200" ry="90" fill="#dccfa8" fill-opacity="0.4" />
    <ellipse cx="700" cy="610" rx="250" ry="110" fill="#b6c4ad" fill-opacity="0.38" />
  </g>
  <rect width="1200" height="760" filter="url(#grain)" opacity="0.5" />
</svg>
